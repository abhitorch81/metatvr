<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradient - Touch the Math</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #e8ecff; }
    canvas { display: block; }
    #intro { position: fixed; left: 16px; top: 16px; max-width: 360px; padding: 14px 16px;
      background: rgba(10,14,34,.78); border: 1px solid rgba(140,160,255,.25); border-radius: 14px;
      font-size: 14px; line-height: 1.45; backdrop-filter: blur(6px); }
    #intro h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
    #intro b { color: #ffd45e; }
    #intro small { color: #9aa6d8; }
  </style>
</head>
<body>
  <div id="intro">
    <h1>&nabla; Gradient</h1>
    Hands-only, seated VR puzzles that let you <b>touch</b> multivariable &amp; vector calculus.<br />
    <small>In a Quest: press <b>Enter VR</b>, then pinch to grab, drop and draw. <br />
    On desktop: use the mouse (click &amp; drag) to preview.</small>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
